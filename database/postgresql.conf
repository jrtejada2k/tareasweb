# PostgreSQL Configuration for TareasWeb
# Purpose: Enable slow query logging and optimize for 1GB RAM VPS
# Requirements: NFR-033-037 (monitoring), NFR-005 (query performance)

# ============================================
# Connection Settings
# ============================================
# Listen on all addresses (required for Docker port mapping)
listen_addresses = '*'
max_connections = 20
superuser_reserved_connections = 3

# ============================================
# Memory Settings (optimized for 300MB container limit)
# ============================================
shared_buffers = 128MB
effective_cache_size = 256MB
maintenance_work_mem = 32MB
work_mem = 4MB
temp_buffers = 8MB

# ============================================
# Query Planner
# ============================================
random_page_cost = 1.1  # SSD optimization
effective_io_concurrency = 200

# ============================================
# Write Ahead Log (WAL)
# ============================================
wal_buffers = 4MB
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 80MB

# ============================================
# Logging Configuration
# ============================================
logging_collector = on
# Write logs under the data directory for container-friendly permissions
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 10MB
log_truncate_on_rotation = off

# Log all statements (for development/testing)
# Set to 'none' in production for better performance
log_statement = 'none'

# Slow Query Logging (FR-109-114, NFR-033)
# Log queries taking longer than 100ms
log_min_duration_statement = 100

# Log additional information for slow queries
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_duration = off
log_error_verbosity = default
log_lock_waits = on
log_temp_files = 0

# ============================================
# Performance Monitoring
# ============================================
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all
# stats_temp_directory removed in PostgreSQL 15+; setting causes error in 16
# stats_temp_directory = '/var/run/postgresql/stats_temp'

# ============================================
# Autovacuum (automatic maintenance)
# ============================================
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# ============================================
# Client Connection Defaults
# ============================================
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# ============================================
# Lock Management
# ============================================
deadlock_timeout = 1s
max_locks_per_transaction = 64

# ============================================
# Security
# ============================================
# Password encryption
password_encryption = scram-sha-256

# SSL (configure in production)
# ssl = on
# ssl_cert_file = '/etc/ssl/certs/ssl-cert-snakeoil.pem'
# ssl_key_file = '/etc/ssl/private/ssl-cert-snakeoil.key'
